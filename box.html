<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cricket Match Contribution</title>
  <link rel="icon" type="image/png" href="cricket-logo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 20px;
      background: #f2f2f2;
      color: #333;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header img {
      width: 40px;
      height: 40px;
    }
    h2 {
      margin-top: 10px;
      color: #007bff;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    textarea {
      height: 60px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 30px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      white-space: pre-wrap;
      line-height: 1.4;
    }
    .copy-btn {
      margin-top: 15px;
      background: #28a745;
    }
    .copy-btn:hover {
      background: #218838;
    }
    .payment-box {
      margin-top: 20px;
      padding: 15px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 6px;
      text-align: center;
    }
    .payment-box img {
      max-width: 200px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    @media (max-width: 600px) {
      input, textarea, button {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="cricket-logo.png" alt="Logo">
    <h2>Cricket Match Contribution</h2>
  </header>

  <label>Match Date:</label>
  <input type="date" id="matchDate">

  <label>Ground Expense (₹):</label>
  <input type="number" id="groundExpense" value="1500">

  <label>Ball & Other Expense (₹):</label>
  <input type="number" id="ballExpense" value="70">

  <label>Previous Balance (₹):</label>
  <input type="number" id="prevBalance" value="250">

  <label>Senior Player Names (comma separated):</label>
  <textarea id="seniorNames">Hussain, Ismail, Vinod</textarea>

  <label>Junior Player Names (comma separated):</label>
  <textarea id="juniorNames">Rayan, Sufyan</textarea>

  <button onclick="generateSummary()">Generate Summary</button>

  <div class="result" id="result"></div>
  <button class="copy-btn" onclick="copyResult()">📋 Copy Summary</button>

  <div class="payment-box">
    <strong>Payment Options:</strong><br>
    UPI ID: <strong>9620447444@upi</strong><br>
    PhonePe: <strong>9620447444</strong><br>
    <img src="phonepe-qr.jpeg" alt="PhonePe QR Code">
  </div>

  <script>
    function generateSummary() {
      const matchDate = document.getElementById('matchDate').value;
      const ground = parseFloat(document.getElementById('groundExpense').value);
      const ball = parseFloat(document.getElementById('ballExpense').value);
      const prev = parseFloat(document.getElementById('prevBalance').value);
      const seniors = document.getElementById('seniorNames').value.split(',').map(s => s.trim()).filter(s => s);
      const juniors = document.getElementById('juniorNames').value.split(',').map(j => j.trim()).filter(j => j);

      const totalExpense = ground + ball;
      const totalWeight = seniors.length + (juniors.length * 0.5);
      const seniorAmt = Math.round(totalExpense / totalWeight);
      const juniorAmt = Math.round(seniorAmt / 2);

      let html = `Results:\nMatch Played: ${matchDate || 'N/A'}\n`;
      html += `Expanse Ground: ₹${ground}\nBall & Expanse: ₹${ball}\n`;
      html += `Previous Balance: ₹${prev}\n`;
      html += `Each Senior contributes: ₹${seniorAmt}\nEach Junior contributes: ₹${juniorAmt}\n`;

      html += `\nSeniors\nName\tAmount\tPaid/NoPaid\n`;
      seniors.forEach(name => {
        html += `${name}\t₹${seniorAmt}\t\n`;
      });

      html += `\nJuniors\nName\tAmount\tPaid/NoPaid\n`;
      juniors.forEach(name => {
        html += `${name}\t₹${juniorAmt}\t\n`;
      });

      html += `\nGrand Total: ₹${totalExpense}\nMake the payment and share screenshot asap`;

      document.getElementById('result').textContent = html;
    }

    function copyResult() {
      const text = document.getElementById('result').textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("Summary copied to clipboard!");
      });
    }
  </script>
</body>
</html>
